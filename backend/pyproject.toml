[project]
name = "bluecarbon-backend"
version = "0.1.0"
description = "Blue Carbon Registry & MRV System - Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.32.0,<0.33",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14.0,<1.15",
    "psycopg2-binary>=2.9.10,<2.10",
    "psycopg[binary,pool]>=3.2.0,<3.3",
    "pydantic>=2.9.0,<2.10",
    "pydantic-settings>=2.5.0,<2.6",
    "python-jose[cryptography]>=3.3.0,<3.4",
    "passlib[bcrypt]>=1.7.4,<1.8",
    "python-multipart>=0.0.9,<0.1",
    "python-dotenv>=1.0.1,<1.1",
    "httpx>=0.27.0,<0.28",
    "pytest>=8.3.0,<8.4",
    "pytest-asyncio>=0.23.0,<0.24",
    "pytest-cov>=5.0.0,<5.1",
    "faker>=25.0.0,<26.0",
]

[project.optional-dependencies]
asyncpg = ["asyncpg>=0.29.0,<0.30"]

[tool.uv.sources]
# Optional: pin specific versions for reproducible builds

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*", "app/main.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by line-length)
    "B008",  # function calls in default arguments
]